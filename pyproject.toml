[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfit"
version = "0.0.1"
description = "A general-purpose 2D irregular-polygon nesting (bin-packing) tool: arranges a set of 2D shapes onto rectangular sheet stock with minimal waste, via a no-fit-polygon bottom-left-fill heuristic."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Emily Marie Williams" },
]
requires-python = ">=3.9"
dependencies = [
  "shapely",
  "pyclipper",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp<2.0"]

[project.scripts]
pyfit = "pyfit.cli:main"
pyfit-mcp = "pyfit.mcp_server:main"

[tool.setuptools]
packages = ["pyfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
